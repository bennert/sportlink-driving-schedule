name: Generate Driving Schedule

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'  # Each Monday at 6:00 UTC

jobs:
  generate-schedule:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Configure GitHub Pages
      uses: actions/configure-pages@v5
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Validate configuration
      run: python configuration_validation.py
      env:
        MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        SPORTLINK_TOKEN_LIST: ${{ secrets.SPORTLINK_TOKEN_LIST }}
        SPORTLINK_TEAM_LIST: ${{ vars.SPORTLINK_TEAM_LIST }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_LIST: ${{ secrets.TELEGRAM_CHAT_LIST }}
        GITHUB_EVENT_NAME: ${{ github.event_name }}
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install reportlab markdown2
        
    - name: Download previous artifacts
      uses: dawidd6/action-download-artifact@v3
      continue-on-error: true
      with:
        name: driving-schedules-md
        path: docs/
        workflow: driving_schedule.yml
        if_no_artifact_found: ignore

    - name: Download previous Google Maps place ID cache
      uses: dawidd6/action-download-artifact@v3
      continue-on-error: true
      with:
        name: google-maps-place-id-cache
        path: docs/
        workflow: driving_schedule.yml
        if_no_artifact_found: ignore
        
    - name: Create driving schedule
      id: create_schedule
      run: |
        python create_driving_schedule.py
      env:
        MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        SPORTLINK_TOKEN_LIST: ${{ secrets.SPORTLINK_TOKEN_LIST }}
        SPORTLINK_TEAM_LIST: ${{ vars.SPORTLINK_TEAM_LIST }}
        
    - name: Check for changes
      id: check_changes
      run: |
        if ls docs/.convert_to_pdf_*.flag 2>/dev/null; then
          echo "changes=true" >> $GITHUB_OUTPUT
          echo "Changes detected - will convert to PDF and send email"
        else
          echo "changes=false" >> $GITHUB_OUTPUT
          echo "No changes detected - skipping PDF conversion and email"
        fi
      shell: bash
        
    - name: Convert to PDF
      run: |
        python convert_driving_schedule_to_pdf.py --all

    - name: Build stable schedule pages
      run: python publish_schedule_pages.py

    - name: Upload GitHub Pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: site

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
        
    - name: Upload markdown files as artifact
      uses: actions/upload-artifact@v4
      with:
        name: driving-schedules-md
        path: |
          docs/*.md
          docs/schedule_changes_*.json
        retention-days: 30

    - name: Upload Google Maps place ID cache
      if: steps.create_schedule.outcome == 'success'
      uses: actions/upload-artifact@v4
      with:
        name: google-maps-place-id-cache
        path: docs/google_maps_place_ids.json
        retention-days: 90
        
    - name: Upload PDF as artifact
      uses: actions/upload-artifact@v4
      with:
        name: driving-schedules-pdf
        path: docs/*.pdf
        retention-days: 90

    - name: Send emails per team
      if: steps.check_changes.outputs.changes == 'true'
      run: |
        python send_team_emails.py
      env:
        EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
        EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        EMAIL_FROM: ${{ vars.EMAIL_FROM }}
        EMAIL_SUBJECT: ${{ vars.EMAIL_SUBJECT }}

    - name: Send weekly Telegram announcements
      if: always() && github.event_name == 'schedule' && steps.create_schedule.outcome == 'success'
      run: python send_telegram_announcements.py
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_LIST: ${{ secrets.TELEGRAM_CHAT_LIST }}